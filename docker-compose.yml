version: "3.8"

services:
  axonserver:
    image: axoniq/axonserver:latest
    container_name: axon-server
    ports:
      - "8024:8024"   # HTTP Dashboard/UI
      - "8124:8124"   # gRPC port for client connections
    environment:
      - AXONSERVER_NAME=axonserver
      - AXONSERVER_HOSTNAME=axonserver
      - AXONIQ_AXONSERVER_DEVMODE_ENABLED=true
    volumes:
      - axon-data:/data
      - axon-events:/eventdata
      - axon-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8024/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  axon-data:
  axon-events:
  axon-config:
